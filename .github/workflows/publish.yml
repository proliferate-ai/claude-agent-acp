name: Publish and Release
on:
  push:
    branches:
      - "upstream/v0.59"
  workflow_dispatch:

jobs:
  release-config:
    name: Validate release configuration
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e
        with:
          node-version: "lts/*"
      - run: npm run check:release
      - name: Report release automation state
        env:
          RELEASE_ENABLED: ${{ vars.RELEASE_ENABLED }}
        run: |
          if [[ "$RELEASE_ENABLED" == "true" ]]; then
            echo "Release automation is enabled." >> "$GITHUB_STEP_SUMMARY"
          else
            echo "::notice title=Release automation disabled::Release Please and npm publication are gated. See .github/RELEASING.md for the bootstrap checklist."
            echo "Release automation is disabled; configuration validation still ran." >> "$GITHUB_STEP_SUMMARY"
          fi

  release-please:
    needs: [release-config]
    if: ${{ vars.RELEASE_ENABLED == 'true' && github.ref == 'refs/heads/upstream/v0.59' }}
    runs-on: ubuntu-latest
    environment: release
    permissions: {}
    steps:
      - name: Validate release credentials
        env:
          RELEASE_PLZ_CLIENT_ID: ${{ vars.RELEASE_PLZ_CLIENT_ID }}
          RELEASE_PLZ_APP_PRIVATE_KEY: ${{ secrets.RELEASE_PLZ_APP_PRIVATE_KEY }}
        run: |
          missing=""
          if [[ -z "$RELEASE_PLZ_CLIENT_ID" ]]; then
            missing="$missing RELEASE_PLZ_CLIENT_ID"
          fi
          if [[ -z "$RELEASE_PLZ_APP_PRIVATE_KEY" ]]; then
            missing="$missing RELEASE_PLZ_APP_PRIVATE_KEY"
          fi
          if [[ -n "$missing" ]]; then
            echo "::error title=Release bootstrap incomplete::Missing:$missing. See .github/RELEASING.md."
            exit 1
          fi
      # Generating a GitHub token, so that PRs and tags created by
      # the release-please-action can trigger actions workflows.
      - name: Generate GitHub token
        uses: actions/create-github-app-token@bcd2ba49218906704ab6c1aa796996da409d3eb1
        id: generate-token
        with:
          client-id: ${{ vars.RELEASE_PLZ_CLIENT_ID }}
          private-key: ${{ secrets.RELEASE_PLZ_APP_PRIVATE_KEY }}
          permission-contents: write
          permission-issues: write
          permission-pull-requests: write
      - uses: googleapis/release-please-action@45996ed1f6d02564a971a2fa1b5860e934307cf7
        id: release
        with:
          token: ${{ steps.generate-token.outputs.token }}
          target-branch: upstream/v0.59
          config-file: release-please-config.json
          manifest-file: .release-please-manifest.json
          # A manual run may create/update a release PR, but only a merge push
          # may turn a merged release PR into a tag and GitHub release.
          skip-github-release: ${{ github.event_name == 'workflow_dispatch' }}
    outputs:
      release_created: ${{ steps.release.outputs.release_created }}
      tag_name: ${{ steps.release.outputs.tag_name }}

  publish-npm:
    name: Publish to npm
    runs-on: ubuntu-latest
    needs: [release-please]
    if: ${{ vars.RELEASE_ENABLED == 'true' && github.event_name == 'push' && github.ref == 'refs/heads/upstream/v0.59' && needs.release-please.outputs.release_created == 'true' }}
    environment: release
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - name: Verify release tag matches workflow commit
        env:
          RELEASE_TAG: ${{ needs.release-please.outputs.tag_name }}
        run: |
          if [[ -z "$RELEASE_TAG" ]] || ! git check-ref-format "refs/tags/$RELEASE_TAG"; then
            echo "::error title=Invalid release tag::Release Please returned an empty or invalid tag."
            exit 1
          fi
          git fetch --no-tags --depth=1 origin "refs/tags/$RELEASE_TAG:refs/tags/$RELEASE_TAG"
          tag_commit="$(git rev-parse "refs/tags/$RELEASE_TAG^{commit}")"
          if [[ "$tag_commit" != "$GITHUB_SHA" ]]; then
            echo "::error title=Release commit mismatch::Tag $RELEASE_TAG points to $tag_commit, but this workflow is publishing $GITHUB_SHA."
            exit 1
          fi
      # Setup .npmrc file to publish to npm
      - uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e
        with:
          node-version: "lts/*"
          registry-url: "https://registry.npmjs.org"
      - run: npm ci
      - run: npm run build
      - run: npm publish
